name: Update project list

# Keeps projects/index.json (the site's safety copy of the project list) up to date
# whenever a project is added or changed. Nobody needs to run this by hand.
on:
  push:
    branches: [main]
    paths:
      - 'projects/**'
      - '!projects/index.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild projects/index.json
        run: |
          python3 - <<'PY'
          import json, os
          out = {}
          for d in sorted(os.listdir('projects')):
              p = os.path.join('projects', d)
              if d.startswith('_') or not os.path.isdir(p):
                  continue
              out[d] = sorted(f for f in os.listdir(p) if os.path.isfile(os.path.join(p, f)))
          with open('projects/index.json', 'w') as f:
              json.dump(out, f, indent=2)
              f.write('\n')
          PY
      - name: Save it if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/index.json
          git diff --cached --quiet || (git commit -m "Update the project list" && git push)
