body[data-step="home"]{background:transparent}
body[data-step="home"]::before{content:"";position:fixed;left:0;right:0;top:0;bottom:0;height:auto;z-index:-1;pointer-events:none;-webkit-mask-image:none;mask-image:none;
background:radial-gradient(ellipse 80% 50% at 50% 0,rgba(140,24,56,.75),transparent 70%),radial-gradient(ellipse 70% 40% at 100% 55%,rgba(110,16,46,.55),transparent 70%),radial-gradient(ellipse 70% 40% at 0 85%,rgba(110,16,46,.5),transparent 70%)}
.bhome{--wine:#1A040C;--deep:#4A0A1F;--burg:#8C1838;--rose:#CF736A;--blush:#FFB3C0;--cream:#F6D7C6;--gold:#E9B24C;--ember:#F08A3C;--glass:rgba(140,24,56,.30);--glass-b:rgba(255,179,192,.22);
--sans:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;--serif:"Lora",Georgia,serif;color:var(--cream);font:300 16px/1.65 var(--sans);overflow-x:clip;-webkit-font-smoothing:antialiased}
.bhome section{padding:68px 0}
/*SKIP *,*:before,*:after*/
.bhome h1,.bhome h2,.bhome h3,.bhome p{margin:0}
.bhome h2{text-wrap:balance}
.bhome .bh-w{max-width:1040px;margin:0 auto;padding:0 22px}
.bhome .bh-eyebrow{font:800 .74rem/1 var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.bhome h2{font:900 clamp(1.9rem,6vw,2.9rem)/1.08 var(--sans);letter-spacing:-.02em;color:var(--cream)}
.bhome h2 i{font:italic 500 1em var(--serif);color:var(--blush);letter-spacing:0}
.bhome .bh-lede{font:italic 500 1.12rem/1.6 var(--serif);color:var(--cream);opacity:.85;max-width:44ch}
@media(max-width:600px){.bhome section{padding:46px 0}.bhome .bh-head{margin-bottom:22px}.bhome .bh-w{padding:0 18px}}
.bhome .bh-head{margin-bottom:34px}
.bhome .bh-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(26,4,12,.78);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--glass-b)}
.bhome .bh-bar .bh-w{display:flex;align-items:center;justify-content:space-between;height:58px}
.bhome .bh-bar img{height:34px;width:auto;display:block}
.bhome .bh-barr{display:flex;align-items:center;gap:8px;position:relative}
.bhome button.bh-menu,.bhome button.bh-menu:hover{width:40px;height:40px;min-width:0;padding:0;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--glass-b);color:var(--cream);box-shadow:none;transform:none;overflow:visible}
.bhome button.bh-menu svg{width:18px;height:18px;fill:currentColor;display:block}
.bhome button.bh-menu[aria-expanded="true"],.bhome button.bh-menu:hover{border-color:var(--gold);color:var(--gold)}
.bhome .bh-nav{position:absolute;right:0;top:calc(100% + 12px);width:min(272px,calc(100vw - 36px));box-sizing:border-box;padding:8px;border-radius:20px;background:rgba(42,6,18,.97);border:1px solid var(--glass-b);box-shadow:0 18px 50px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:2px;z-index:30}
.bhome .bh-nav[hidden]{display:none}
.bhome .bh-nav button.bh-ni,.bhome .bh-nav button.bh-ni:hover{display:block;width:100%;margin:0;padding:13px 14px;border:0;border-radius:12px;background:none;color:var(--cream);font:600 .92rem/1.25 var(--sans);letter-spacing:0;text-align:left;box-shadow:none;transform:none;overflow:visible}
.bhome .bh-nav button.bh-ni:hover,.bhome .bh-nav button.bh-ni:focus-visible{background:var(--glass);color:var(--gold)}
.bhome .bh-brand{display:flex;align-items:center;gap:10px;font:800 .78rem/1.15 var(--sans);letter-spacing:.14em;text-transform:uppercase}
.bhome .bh-brand small{display:block;color:var(--gold);font-weight:600;letter-spacing:.2em;font-size:.6rem}
.bhome .bh-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;font:800 1rem/1 var(--sans);padding:17px 30px;border-radius:99px;text-decoration:none;transition:transform .2s,box-shadow .2s}
.bhome .bh-gold{background:linear-gradient(135deg,#F3C766,var(--gold) 55%,var(--ember));color:var(--wine);box-shadow:0 10px 34px rgba(233,178,76,.38)}
.bhome .bh-gold:hover{transform:translateY(-2px);box-shadow:0 14px 40px rgba(233,178,76,.5)}
.bhome .bh-ghost{background:transparent;color:var(--cream);border:1.5px solid rgba(246,215,198,.4)}
.bhome .bh-ghost:hover{background:var(--glass)}
.bhome .bh-sm{padding:11px 20px;font-size:.84rem}
.bhome :focus-visible{outline:3px solid var(--blush);outline-offset:3px}
.bhome .bh-hero{position:relative;overflow:hidden;text-align:center;padding:54px 0 70px}
.bhome .bh-hero:before{content:"";position:absolute;inset:0;background:url(assets/burg-hero.jpg) 50% 30%/cover no-repeat;opacity:.34;mix-blend-mode:luminosity}
.bhome .bh-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(74,10,31,.55),rgba(74,10,31,.35) 40%,var(--wine) 98%)}
.bhome .bh-hero .bh-w{position:relative;z-index:2}
.bhome .bh-hero .bh-logo{width:104px;height:auto;margin:0 auto 20px;display:block;filter:drop-shadow(0 8px 24px rgba(0,0,0,.5))}
.bhome .bh-pres{font:600 .7rem/1.4 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--blush)}
.bhome h1{font:900 clamp(3rem,15vw,9rem)/.95 var(--sans);letter-spacing:-.025em;text-transform:uppercase;margin:16px 0 14px;color:var(--cream)}
.bhome h1 em{font-style:normal;background:linear-gradient(180deg,#FBDD8E,var(--gold) 50%,var(--ember));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #8a5a14) drop-shadow(0 14px 18px rgba(0,0,0,.5))}
.bhome .bh-tag{font:italic 500 clamp(1.1rem,3.6vw,1.45rem)/1.4 var(--serif);color:var(--cream);margin:0 auto 26px;max-width:30ch}

.bhome .bh-cta{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.bhome .bh-cta{max-width:520px;margin:0 auto}
.bhome .bh-cta .bh-btn{flex:1 1 0;min-width:0;padding:16px 10px;font-size:clamp(.8rem,3.9vw,1rem);line-height:1.2;text-align:center;white-space:normal}
.bhome .bh-cta #go-about{flex:1 1 100%}
.bhome .bh-spots{display:inline-flex;align-items:center;gap:9px;margin-top:22px;background:rgba(240,138,60,.16);border:1px solid rgba(240,138,60,.5);color:var(--ember);border-radius:99px;padding:7px 16px;font:800 .78rem/1 var(--sans);letter-spacing:.06em;text-transform:uppercase}
.bhome .bh-spots i{width:8px;height:8px;border-radius:50%;background:var(--ember);animation:bh-pulse 1.8s infinite}
@keyframes bh-pulse{50%{opacity:.25;transform:scale(1.5)}}
.bhome .bh-cd{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:560px;margin:0 auto}
.bhome .bh-cd div{background:var(--glass);border:1px solid var(--glass-b);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:18px;padding:16px 4px 12px;text-align:center}
.bhome .bh-cd b{display:block;font:900 clamp(1.8rem,8vw,2.7rem)/1 var(--sans);color:var(--gold);font-variant-numeric:tabular-nums}
.bhome .bh-cd span{font:600 .64rem/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--rose)}
.bhome .bh-split{display:grid;gap:36px;align-items:center}
@media(min-width:820px){.bhome .bh-split{grid-template-columns:minmax(0,400px) 1fr;gap:64px}}
.bhome .bh-poster{border-radius:22px;overflow:hidden;border:1px solid var(--glass-b);box-shadow:0 30px 70px rgba(0,0,0,.6),0 0 0 8px rgba(233,178,76,.08);max-width:420px;margin:0 auto;transform:rotate(-1.4deg);transition:transform .4s}
.bhome .bh-poster:hover{transform:rotate(0)}
.bhome .bh-poster img{display:block;width:100%;height:auto}
.bhome .bh-hint{text-align:center;font:600 .78rem var(--sans);color:var(--rose);margin-top:16px;letter-spacing:.06em}
.bhome .bh-facts{display:grid;gap:12px;margin:26px 0}
.bhome .bh-fact{display:flex;gap:16px;align-items:center;text-decoration:none;color:inherit;background:var(--glass);border:1px solid var(--glass-b);border-radius:18px;padding:18px 20px;transition:border-color .2s,transform .2s}
.bhome a.bh-fact:hover{border-color:var(--gold);transform:translateX(4px)}
.bhome .bh-fact .bh-ic{width:46px;height:46px;border-radius:14px;background:var(--burg);display:grid;place-items:center;flex:none}
.bhome .bh-fact svg{width:22px;height:22px;fill:none;stroke:var(--cream);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bhome .bh-fact small{display:block;font:800 .66rem/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--blush);margin-bottom:5px}
.bhome .bh-fact b{display:block;font:800 1.08rem/1.3 var(--sans);color:var(--cream)}
.bhome .bh-fact em{display:block;font:600 .8rem var(--sans);color:var(--gold);font-style:normal;margin-top:3px}
.bhome .bh-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.bhome .bh-card{position:relative;overflow:hidden;background:linear-gradient(160deg,rgba(140,24,56,.42),rgba(74,10,31,.6));border:1px solid var(--glass-b);border-radius:22px;padding:26px 24px;transition:transform .25s,border-color .25s}
.bhome .bh-card:hover{transform:translateY(-6px);border-color:var(--rose)}
.bhome .bh-card:before{content:attr(data-n);position:absolute;right:16px;top:6px;font:900 4.4rem/1 var(--sans);color:rgba(207,115,106,.14)}
.bhome .bh-card .bh-ic{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--burg),var(--deep));border:1px solid var(--glass-b);display:grid;place-items:center;margin-bottom:18px}
.bhome .bh-card svg{width:26px;height:26px;fill:none;stroke:var(--gold);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.bhome .bh-card h3{font:800 1.12rem/1.25 var(--sans);margin-bottom:8px;color:var(--cream)}
.bhome .bh-card p{font-size:.93rem;color:var(--cream);opacity:.8}
@media(max-width:600px){.bhome .bh-cards{grid-template-columns:1fr 1fr;gap:12px}.bhome .bh-card{padding:18px 16px}.bhome .bh-card:before{font-size:3rem;right:10px}.bhome .bh-card .bh-ic{width:42px;height:42px;border-radius:13px;margin-bottom:12px}.bhome .bh-card svg{width:22px;height:22px}.bhome .bh-card h3{font-size:.98rem}.bhome .bh-card p{font-size:.82rem;line-height:1.5}}
.bhome .bh-slider{--ih:clamp(340px,60vw,540px);position:relative;border-radius:28px;overflow:hidden;border:1px solid var(--glass-b);background:linear-gradient(180deg,var(--wine),var(--deep));touch-action:pan-y}
.bhome .bh-track{display:flex;transition:transform .7s cubic-bezier(.65,0,.25,1)}
.bhome .bh-sl{position:relative;flex:0 0 100%;margin:0;display:flex;flex-direction:column}
.bhome .bh-sl>img{display:block;width:100%;height:var(--ih);object-fit:cover;object-position:50% 70%;cursor:zoom-in}
.bhome .bh-sl:after{content:"";position:absolute;left:0;right:0;top:calc(var(--ih) - 150px);height:150px;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(26,4,12,.96))}
.bhome .bh-sl .bh-txt{position:relative;z-index:2;margin-top:-34px;padding:0 24px 30px;pointer-events:none}
.bhome .bh-sl h3{font:900 clamp(1.9rem,6vw,2.9rem)/1.08 var(--sans);letter-spacing:-.02em;color:var(--cream)}
.bhome .bh-sl h3 i{font:italic 500 1em var(--serif);color:var(--blush);letter-spacing:0}
.bhome .bh-sl p:not(.bh-eyebrow){font:italic 500 1.1rem/1.6 var(--serif);max-width:52ch;margin-top:14px}
.bhome .bh-sl b{font-weight:500;color:var(--gold)}
/* small thank-you to the previous year's partner, inside the "Chai, Chill and Chartered 2025" slide (much smaller than the current co-sponsor card) */
.bhome .bh-sl .bh-txt p.bh-thx{display:flex;align-items:center;gap:12px;margin-top:18px;font:600 .82rem/1.35 var(--sans);letter-spacing:.02em;color:var(--cream);opacity:.9}
.bhome .bh-sl .bh-txt p.bh-thx img{display:block;width:auto;height:58px;flex:none;border-radius:12px}
.bhome .bh-sl .bh-txt p.bh-thx span{display:block}
/* two partners (Mizaaniya slide): "With thanks to" on its own line, then each logo with its own name below it, a faint divider between the two */
.bhome .bh-sl .bh-txt p.bh-thx.bh-thx3{flex-direction:column;align-items:flex-start;gap:10px}
.bhome .bh-sl .bh-txt p.bh-thx3 .bh-pair{display:flex;align-items:flex-start;flex-wrap:wrap;row-gap:12px}
.bhome .bh-sl .bh-txt p.bh-thx3 .bh-pt{display:flex;flex-direction:column;align-items:center;gap:7px;padding:0 16px}
.bhome .bh-sl .bh-txt p.bh-thx3 .bh-pt:first-child{padding-left:0}
.bhome .bh-sl .bh-txt p.bh-thx3 .bh-pt+.bh-pt{border-left:1px solid rgba(246,215,198,.32)}
.bhome .bh-sl .bh-txt p.bh-thx3 .bh-pt b{text-align:center}
.bhome .bh-sl .bh-txt p.bh-thx b{display:block;font:700 .95rem/1.25 var(--sans);color:var(--cream)}
/* phones: the two partner logos share the row and scale with the screen width (each takes half, up to its normal size) */
@media(max-width:560px){
.bhome .bh-sl .bh-txt p.bh-thx3 .bh-pair{flex-wrap:nowrap;width:100%}
.bhome .bh-sl .bh-txt p.bh-thx3 .bh-pt{flex:1 1 0;min-width:0;width:auto;padding:0 10px}
.bhome .bh-sl .bh-txt p.bh-thx3 .bh-pt img{width:100%;max-width:150px;height:auto}
.bhome .bh-sl .bh-txt p.bh-thx3 .bh-pt b{font-size:.85rem}
}
.bhome .bh-dots{position:absolute;top:12px;right:12px;z-index:5;display:flex;background:rgba(26,4,12,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:99px;padding:0 4px}
.bhome .bh-dots button{width:32px;height:32px;background:none;border:0;padding:0;cursor:pointer;display:grid;place-items:center}
.bhome .bh-dots button:before{content:"";width:9px;height:9px;border-radius:99px;background:rgba(246,215,198,.55);transition:all .3s}
.bhome .bh-dots button[aria-current=true]:before{width:26px;background:var(--gold)}
.bhome .bh-steps{display:grid;gap:14px;counter-reset:s}
@media(min-width:760px){.bhome .bh-steps{grid-template-columns:repeat(3,1fr)}}
.bhome .bh-step{counter-increment:s;background:linear-gradient(160deg,rgba(140,24,56,.42),rgba(74,10,31,.6));border:1px solid var(--glass-b);border-radius:22px;padding:26px 24px}
.bhome .bh-step:before{content:counter(s);display:block;font:900 3.6rem/1 var(--sans);background:linear-gradient(180deg,#FBDD8E,var(--ember));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:10px}
.bhome .bh-step h3{font:800 1.08rem var(--sans);margin-bottom:6px}
.bhome .bh-step p{font-size:.93rem;opacity:.8}
@media(max-width:759px){.bhome .bh-step{display:grid;grid-template-columns:48px 1fr;column-gap:14px;align-items:center;padding:18px 18px}.bhome .bh-step:before{grid-row:span 2;font-size:2.8rem;margin:0}.bhome .bh-step{row-gap:0}}
/* "See walkthrough": a self-playing demo of the booking (tutorial.html), tucked under the three steps. Closed = one button. Open = the step buttons next to the player (stacked on phones). */
.bhome .bh-wt{margin-top:26px;text-align:center}
.bhome button.bh-wt-open{gap:10px;padding:15px 26px}
.bhome .bh-wt svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bhome .bh-wt svg.bh-wt-play{fill:currentColor;stroke:none}
.bhome .bh-wt-chev{transition:transform .25s}
.bhome .bh-wt-open[aria-expanded=true] .bh-wt-chev{transform:rotate(180deg)}
.bhome .bh-wt-panel{display:grid;gap:20px;margin-top:18px;padding:12px;text-align:left;background:linear-gradient(160deg,rgba(140,24,56,.42),rgba(74,10,31,.6));border:1px solid var(--glass-b);border-radius:22px}
@media(min-width:760px){.bhome .bh-wt-panel{grid-template-columns:minmax(0,1fr) minmax(0,380px);align-items:start;gap:34px;padding:28px}}
.bhome button.bh-btn.bh-wt-all{width:100%}
.bhome button.bh-wt-all[aria-pressed=true]{box-shadow:0 0 0 3px rgba(233,178,76,.4),0 10px 34px rgba(233,178,76,.38)}
.bhome .bh-wt-lbl{margin:0;font:800 .72rem/1.3 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.bhome .bh-wt-grp{margin-top:22px}
.bhome .bh-wt-gh{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;margin:0 0 10px}
.bhome button.bh-wt-pl{display:inline-flex;align-items:center;gap:6px;font:700 .76rem/1 var(--sans);letter-spacing:.02em;padding:8px 13px;border-radius:99px;background:transparent;border:1.5px solid var(--gold);color:var(--gold);box-shadow:none;transform:none}
.bhome button.bh-wt-pl svg{width:12px;height:12px}
.bhome button.bh-wt-pl:hover{background:rgba(233,178,76,.16);box-shadow:none;transform:none}
.bhome button.bh-wt-pl[aria-pressed=true]{background:var(--gold);color:var(--wine)}
.bhome .bh-wt-tabs{display:flex;flex-wrap:wrap;gap:8px}
.bhome button.bh-wt-tab{display:inline-flex;gap:5px;font:600 .84rem/1.3 var(--sans);letter-spacing:0;text-align:left;padding:10px 14px;border-radius:14px;background:rgba(26,4,12,.35);border:1.5px solid rgba(246,215,198,.28);color:var(--cream);box-shadow:none;transform:none}
.bhome button.bh-wt-tab b{font-weight:800;color:var(--gold);white-space:nowrap}
.bhome button.bh-wt-tab:hover{background:var(--glass);border-color:rgba(246,215,198,.5);box-shadow:none;transform:none}
.bhome button.bh-wt-tab[data-now]{border-color:rgba(233,178,76,.75)}
.bhome button.bh-wt-tab[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:var(--wine)}
.bhome button.bh-wt-tab[aria-pressed=true] b{color:var(--wine)}
@media(max-width:759px){.bhome button.bh-wt-tab{flex:1 1 calc(50% - 4px)}}
.bhome .bh-wt-stage{position:relative;width:100%;max-width:380px;margin:0 auto;aspect-ratio:9/16;border-radius:18px;overflow:hidden;background:#080104;border:1px solid var(--glass-b);box-shadow:0 26px 50px -30px rgba(0,0,0,.8)}
.bhome .bh-wt-stage iframe{position:absolute;left:0;top:0;width:100%;height:100%;border:0;display:block}
.bhome .bh-sponsor{display:grid;gap:24px;align-items:center;text-align:center;background:linear-gradient(135deg,var(--deep),rgba(140,24,56,.55));border:1px solid var(--glass-b);border-radius:28px;padding:34px 26px}
@media(min-width:760px){.bhome .bh-sponsor{grid-template-columns:auto 1fr;text-align:left;padding:38px 44px;gap:44px}}
.bhome .bh-sponsor h2{font-size:clamp(1.5rem,4.5vw,2rem);margin-bottom:10px}
.bhome .bh-sponsor p{opacity:.82}
.bhome .bh-final{text-align:center;background:radial-gradient(ellipse 70% 100% at 50% 100%,rgba(233,178,76,.2),transparent 70%),linear-gradient(180deg,var(--deep),var(--wine));border:1px solid var(--glass-b);border-radius:32px;padding:56px 24px}
.bhome .bh-final h2{margin-bottom:12px}
.bhome .bh-final .bh-lede{margin:0 auto 28px}
.bhome .bh-foot{padding:34px 0 110px;text-align:center;font:600 .78rem/1.8 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--rose)}
.bhome .bh-foot b{color:var(--cream)}
.bhome .bh-flogos{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:22px}
.bhome .bh-flogos img{display:block;width:auto}
.bhome .bh-flogos .bh-fm{height:46px}
.bhome .bh-flogos .bh-fe{height:58px}
.bhome .bh-fsep{width:1.5px;height:40px;background:var(--glass-b)}
.bhome .bh-fab{position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:25;max-width:420px;margin:0 auto;transform:translateY(140%);transition:transform .35s}
.bhome .bh-fab.bh-on{transform:none}
.bhome .bh-fab.bh-off{transform:translateY(140%)}
.bh-lb{position:fixed;inset:0;z-index:40;background:rgba(26,4,12,.94);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.bh-lb img{max-width:100%;max-height:100%;border-radius:14px}
.bhome .bh-rv{opacity:0;transform:translateY(26px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.bhome .bh-rv.bh-in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.bhome .bh-rv{opacity:1;transform:none;transition:none}.bhome .bh-spots i{animation:none}}
/* scroll-linked pop (homeMount): while a section is part-way, --p (0 to 1) is set from the scroll position and drives it directly, with no timed transition */
.bhome .bh-rv.bh-in{transition:transform .25s var(--ease,ease),border-color .25s}   /* fully popped: no timed fade any more (the pop itself is driven in homeMount), only the hover lift */

<script>
/* ===== CONFIG: change these in one place ===== */
const CONFIG={
  eventName:"Ehsaas'26",
  eventLine:"Sun 22 Nov 2026, 2 PM · Bloom Creative Zone, Haralur",
  ticketDate:"Sunday, 22 November 2026",          // shown on the ticket
  eventStartISO:"2026-11-22T14:00:00+05:30",       // backup start time for "Add to calendar" (the live time comes from Admin > Settings)
  ticketTime:"2:00 PM",                            // shown on the ticket
  ticketVenue:"Bloom Creative Zone, Haralur",  // shown on the ticket
  organiserName:"Mallu Articles Bengaluru",        // shown on the ticket
  ticketTagline:"Where strangers feel like home", // slogan under the title on the ticket
  // The UPI ID, the payee name and the organisers' WhatsApp number are NOT here any more:
  // they are set in Admin > Settings > Payment details and read from the database.
  supabaseUrl:"demo://sample",
  supabaseKey:"demo"   // publishable key: safe to be public
};
/* ===== libraries that load in the background =====
   libReady resolves (true or false) once the script tag has loaded, failed, or 20 seconds have passed. The tags set window.__sb / __qr to 1 (loaded)
   or 2 (failed), so it also works when the script finished before this code ran. */
function libReady(id,flag,up){return new Promise(res=>{
  if(up()||window[flag]===1)return res(up());
  if(window[flag]===2)return res(false);
  const el=document.getElementById(id);if(!el)return res(false);
  el.addEventListener("load",()=>res(up()));el.addEventListener("error",()=>res(false));
  setTimeout(()=>res(up()),20000)})}
const sbReady=libReady("sb-lib","__sb",()=>!!(window.supabase&&window.supabase.createClient));
const qrReady=libReady("qr-lib","__qr",()=>typeof qrcode==="function");
const whenQR=f=>typeof qrcode==="function"?f():qrReady.then(()=>{if(typeof qrcode==="function")f()});
/* `db` is a thin wrapper with only what this page uses (rpc and one storage upload). Every call waits for the Supabase library, so a tap that
   comes before it has arrived simply waits. If the library never arrives, calls answer with an error, which the page already handles. */
let sbClient=null;
async function sbGet(){
  if(!sbClient){await sbReady;
    if(window.supabase&&window.supabase.createClient){try{sbClient=window.supabase.createClient(CONFIG.supabaseUrl,CONFIG.supabaseKey,{auth:{persistSession:false,autoRefreshToken:false}})}catch(_){}}}
  return sbClient}
const NOCLIENT={data:null,error:{message:"no client"}};
const db={
  rpc:async(...a)=>{const c=await sbGet();return c?c.rpc(...a):NOCLIENT},
  storage:{from:bucket=>({upload:async(...a)=>{const c=await sbGet();return c?c.storage.from(bucket).upload(...a):NOCLIENT}})}
};

/* Home asks for the live status (spots left, price, deadline) so it can show them. It is the same read-only call the Register page makes. It never blocks Home,
   it is asked at most every 30 seconds, and it is dropped if the visitor has already moved on. */
let stAt=0;
async function loadHomeStatus(){
  if(Date.now()-stAt<30000||!await sbGet())return;
  try{const r=await Promise.race([db.rpc("get_public_status",{p_session:S.sid}),new Promise(res=>setTimeout(()=>res(null),4000))]);
    if(r&&r.data&&!r.error&&typeof r.data==="object"&&S.step==="home"){applyStatus(r.data);stAt=Date.now()}}catch(_){}
}
async function load(){
  /* speed (Nov 2026): event details and payment details are asked at the same time as the status instead of one after the other, and nothing
     waits for them unless the screen being shown needs them. If Home asked for the status less than a minute ago and registration is open,
     the form opens at once and the heartbeat (beat) re-checks it straight away. */
  loadEvent();const py=S.pay?null:loadPay();
  if(S.step==="loading"&&S.status&&S.status.accepting&&Date.now()-stAt<60000){
    S.step="form";if(S.n>maxN()){setN(maxN());S.friends=S.n>1}
    render();beat();return}
  try{
    const{data,error}=await db.rpc("get_public_status",{p_session:S.sid});if(error)throw error;
    applyStatus(data);
    if(!data.accepting&&!data.grace_until)S.step="closed";
    else{if(S.step==="loading"||S.step==="closed"||S.step==="error")S.step="form";
      if(S.n>maxN()){setN(maxN());S.friends=S.n>1}}
  }catch(_){S.step="error"}
  if(py&&(S.step==="closed"||S.step==="error"))await py;   /* these two screens show the organisers' WhatsApp button */
  render();
  if(S.step==="form")beat();
}

let skew=0,expAt=0;
const inFill=()=>["form","summary","pay"].includes(S.step);
function applyStatus(d){S.status=d;if(d&&d.server_now)skew=new Date(d.server_now).getTime()-Date.now()}
const IST={timeZone:"Asia/Kolkata"};
function fmtT(iso){try{return new Date(iso).toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit",hour12:true,...IST}).toUpperCase()}catch(_){return""}}
function fmtWhen(iso){try{const d=new Date(iso),day=x=>x.toLocaleDateString("en-IN",{day:"numeric",month:"short",...IST});
  return fmtT(iso)+(day(d)===day(new Date(Date.now()+skew))?"":" on "+day(d))}catch(_){return""}}
function graceMs(){return S.status&&S.status.grace_until?new Date(S.status.grace_until).getTime()-(Date.now()+skew):null}
async function beat(){
  if(!inFill())return;
  try{
    const{data,error}=await db.rpc("registration_heartbeat",{p_session:S.sid});if(error)throw error;
    applyStatus(data);
    if(!data.accepting&&!data.grace_until&&inFill()&&!S.busy){S.graceLost=true;S.step="closed";render()}
  }catch(_){}
  paintBar();
  checkPay();
}
function paintBar(){
  const el=$("#gbar");if(!el)return;
  const ms=graceMs();
  if(ms!=null&&ms>0&&inFill()){
    const m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60;
    el.textContent=(S.status.closed_reason==="deadline"?"The registration deadline has passed, but you have ":"Registration has paused, but you have ")+m+":"+String(s).padStart(2,"0")+" left to finish your booking. Please pay, upload the screenshot and submit."+(S.status.reopen_at?" If you think your registration will take more than 10 minutes, please continue after "+fmtWhen(S.status.reopen_at)+" (when registration reopens).":"");
    el.hidden=false;
  }else{
    el.hidden=true;
    if(ms!=null&&ms<=0&&inFill()&&!S.busy&&Date.now()-expAt>5000){expAt=Date.now();beat()}
  }
}

function reveal(){

/* Home behaviour: the clicks (poster zoom, the floating Register button, the optional sponsor card). The movement (reveal on scroll, countdowns,
   the floating button appearing, the count-down of the spots) is also in this function. Torn down on every other screen. */
let homeAC=null;
const SPONSOR={src:"",name:"Eagles Institute of Management",logo:"assets/burg-sponsor-logo.png",video:"assets/sponsor-video.mp4"};   /* Co-sponsor. NAME and LOGO also show at the very bottom of Home ("Co-sponsored by ..."): edit them here and replace assets/sponsor-logo.png; empty strings hide that line. VIDEO plays in the co-sponsor card: put the file at assets/sponsor-video.mp4 (an MP4 with H.264 video and AAC sound plays on every phone); until the file exists the video is simply left out. Set video to "" to never show one. The sponsor card is always shown. Put the poster at this path (assets/sponsorfolder.jpg); until it exists only the poster part is left out. Put the sponsor's name in name to mention it. */
function homeUnmount(){if(homeAC){homeAC.abort();homeAC=null}}
/* a picture opens in the motion script's lightbox (it grows out of the poster); the plain zoom is the backup */
/* "See walkthrough" (Home, under the three steps). The demo is tutorial.html in an iframe: it is only fetched when the panel is opened and is removed again when the panel is closed.
   "See full walkthrough" plays everything, a step button plays only that step, and the dots inside the player skip between steps (they keep the mode that was chosen).
   The page and the player talk by postMessage: we send {wt:"play",step,single}; it answers {wt:"ready"} once, and {wt:"step",n} whenever the step changes (so the buttons can follow along). */
function wtMount(root,on,sig,RM){
  const wt=root.querySelector("#wt");if(!wt)return;
  const open=wt.querySelector("#wt-open"),panel=wt.querySelector("#wt-panel"),box=wt.querySelector("#wt-stage"),btns=[].slice.call(wt.querySelectorAll("[data-wt]"));
  const starts=[].slice.call(wt.querySelectorAll("[data-from]")).map(b=>+b.dataset.from);   /* the first step of each process */
  const grpOf=n=>"p"+(starts.filter(f=>n>=f).length||1);
  let fr=null,ready=false,pend=null,mode="",cur=0,grp="";   /* mode: all / proc (one process) / one (one step) */
  const paint=()=>btns.forEach(b=>{const k=b.dataset.wt,tab=/^\d+$/.test(k),
      sel=k==="all"?mode==="all":tab?mode==="one"&&+k===cur:mode==="proc"&&k===grp;
    b.setAttribute("aria-pressed",String(sel));
    if(tab){if((mode==="all"||mode==="proc")&&+k===cur)b.setAttribute("data-now","");else b.removeAttribute("data-now")}});
  const send=m=>{if(ready&&fr){try{fr.contentWindow.postMessage(m,location.origin)}catch(_){}}else pend=m};
  const drop=()=>{if(fr){fr.remove();fr=null}ready=false;pend=null};
  function shut(){drop();mode="";cur=0;grp="";panel.hidden=true;open.setAttribute("aria-expanded","false");paint()}
  function show(){panel.hidden=false;open.setAttribute("aria-expanded","true");
    if(!fr){fr=document.createElement("iframe");fr.title="Step-by-step booking walkthrough";fr.src="tutorial.html?embed=1";box.appendChild(fr)}}   /* loads while the visitor picks */
  on(open,"click",()=>{panel.hidden?show():shut()});
  on(wt,"click",e=>{const b=e.target.closest("[data-wt]");if(!b||!wt.contains(b))return;
    const k=b.dataset.wt;
    if(k==="all"){mode="all";cur=0}
    else if(/^\d+$/.test(k)){mode="one";cur=+k}
    else{mode="proc";grp=k;cur=+b.dataset.from}
    paint();send({wt:"play",step:cur,mode:mode});
    if(matchMedia("(max-width:759px)").matches)box.scrollIntoView({behavior:RM?"auto":"smooth",block:"nearest"})});   /* stacked layout: bring the player into view */
  on(window,"message",e=>{if(e.origin!==location.origin||!fr||e.source!==fr.contentWindow)return;const d=e.data;if(!d||typeof d!=="object")return;
    if(d.wt==="ready"){ready=true;if(pend){const m=pend;pend=null;send(m)}}
    else if(d.wt==="step"){if(!mode)mode="all";cur=+d.n||0;if(mode==="proc"&&cur)grp=grpOf(cur);paint()}});   /* no mode yet = the visitor pressed Play inside the player, which is the full walkthrough */
  sig.addEventListener("abort",drop);

function homeMount(){
  homeUnmount();const root=document.querySelector("#app .bhome");if(!root)return;

  }
  /* sections pop in as they are scrolled to. Two things drive each section and the FURTHER ALONG one wins:
     (1) time: when the section's top edge comes into view (POP_TRIG, a share of the screen height) a normal timed pop of POP_MS starts (perfect for slow scrolling);
     (2) position: the section is 0% popped with its top edge at the bottom of the screen and 100% once it has risen to POP_END (covers fast scrolling and the Register
         button's jump, which would otherwise land on empty space).
     A section never un-pops. Reduced motion: everything is simply shown. */
  const rv=[].slice.call(root.querySelectorAll(".bh-rv"));
  if(RM)rv.forEach(el=>el.classList.add("bh-in"));
  else{
    const POP_TRIG=.92,POP_START=1,POP_END=.82,POP_MS=800;   /* tune here (the first three are shares of the screen height, from the top) */
    const ease=x=>1-Math.pow(1-x,3);

function transferNote(tr){
  if(!tr||!tr.transfers||!tr.transfers.length)return"";
  const L={code_active:"Code active",pending_admin:"A buyer has applied",done:"Transferred",rejected:"Not approved",withdrawn:"Closed",replaced:"Replaced by a newer code",expired:"Code expired"};
  return `<div class="card"><b>Your transfers</b>`+tr.transfers.map(x=>{
    let h=`<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--line)"><div class="sw"><span>${esc(x.ticket_label||"")} · ${x.mode==="public"?"Public":"Private"}</span>${pill(x.status==="done"?"ok":x.status==="rejected"||x.status==="withdrawn"||x.status==="expired"?"bad":"wait",L[x.status]||esc(x.status))}</div>`;
    if(x.status==="code_active"&&x.code)h+=`<div class="note" style="margin-top:6px">Code <b style="letter-spacing:.15em;font-size:1.1rem">${esc(x.code)}</b> · Valid until ${esc(fmtWhen(x.expires_at))}</div><div class="row"><button class="ghost" data-xcancel="${esc(x.ticket_label)}">Cancel this code</button></div>`;
    if(x.status==="pending_admin")h+=`<p class="note" style="margin:6px 0 0">${x.buyer_name?esc(x.buyer_name)+" has applied. ":""}The organisers may call your registered number to confirm. Your ticket stays valid until the transfer is complete.</p>`;
    if(x.status==="done"){h+=`<p class="note" style="margin:6px 0 0">${x.buyer_name?"Your ticket now belongs to "+esc(x.buyer_name)+".":"Your ticket was transferred."}`;
      if(x.mode==="public"&&x.amount_to_receive)h+=x.payout==="paid"?` You have been paid ₹${esc(x.amount_to_receive)}.`:` The organisers will pay you ₹${esc(x.amount_to_receive)} using the UPI ID or number you provided.`;
      h+=`</p>`}
    if(x.status==="rejected")h+=`<p class="note" style="margin:6px 0 0">The organisers didn't approve this transfer. Your ticket remains unchanged.</p>`;
    return h+`</div>`}).join("")+`</div>`}
function bookingCard(d){
  const msg="Hi, I'm checking on my "+CONFIG.eventName+" booking, ID "+d.booking_code+".";
  const idl=`<b style="letter-spacing:.08em">${esc(d.booking_code)}</b>`;
  const live=d.tickets.filter(t=>!t.transferred),moved=d.tickets.filter(t=>t.transferred);
  const names=d.tickets.length?`<ul class="names">`+d.tickets.map(t=>`<li>${esc(t.name)} <span class="note">· ${esc(t.food)}${t.label&&t.label!=="—"?" · "+esc(t.label):""}</span>${t.transferred?` ${pill("wait","Transferred")}`:""}</li>`).join("")+`</ul>`:"";
  if(d.kind==="transfer"){
    const tr=d.transfer||{},st=tr.state,w=(c,t)=>`<div class="sw">${idl}${pill(c,t)}</div>`;
    if(d.status==="paid")return `<div class="card">${w("ok","Confirmed")}<p style="margin:10px 0 0">Your transfer is complete. This is now your ticket.</p>${names}<div class="row"><button data-view="1">View Ticket</button></div></div>`;
    const T={pending:["wait","Pending verification","The organisers have been notified. They may call the seller to confirm"+(tr.type==="public"?", then ask you to pay the standard ticket price here":"")+". Please check back here."],
      payment_due:["wait","Payment needed","The organisers have confirmed with the seller. Please pay ₹"+esc(tr.amount_due)+" and upload your payment screenshot."],
      payment_submitted:["wait","Payment submitted","The organisers have your screenshot and are verifying it against the bank statement."],
      payment_verified:["wait","Payment verified","Your payment is verified. The organisers will complete the transfer shortly."],
      rejected:["bad","Not approved","This transfer was not approved. Please contact the organisers."],
      return_due:["bad","Not approved · refund due","This transfer could not be completed. Your payment will be returned. If this takes long, please contact the organisers."],
      returned:["ok","Payment returned","This transfer could not be completed and your payment has been returned."]}[st]||["wait","Pending verification",""];
    return `<div class="card">${w(T[0],T[1])}<p style="margin:10px 0 0">${T[2]}</p><div class="row">${st==="payment_due"?`<button data-tpay="1">Pay ₹${esc(tr.amount_due)}</button>`:""}${contactBtn(msg)}</div></div>`}
  if(d.status==="paid")return `<div class="card"><div class="sw">${idl}${pill("ok","Confirmed")}</div>${names}<div class="row">${live.length?`<button data-view="1">View Ticket${live.length>1?"s":""}</button>`:""}${live.length&&xOpen()?`<button class="ghost" data-xstart="1">Transfer a ticket</button>`:""}</div>${moved.length&&!live.length?`<p class="note">This ticket was transferred to someone else.</p>`:""}</div>`+transferNote(d.xstatus);
  if(d.status==="rejected")return `<div class="card"><div class="sw">${idl}${pill("bad","Not verified")}</div>${names}<p class="err">We couldn't verify this payment. Please contact the organisers.</p><div class="row">${contactBtn(msg)}</div></div>`;
  return `<div class="card"><div class="sw">${idl}${pill("wait","Pending verification")}</div>${names}<p class="note">Your payment is being verified. If this takes longer than expected, please contact the organisers.</p><div class="row">${contactBtn(msg)}</div></div>`;
}

async function doSearch(){
  const T=S.tk,code=normCode(T.q),ph=String(T.phone||"").replace(/\D/g,"");T.msg="";T.res=null;T.nf=false;
  if(!/^[0-9A-F]{8}$/.test(code)||!/^\d{10}$/.test(ph)){T.nf=true;return render()}
  T.busy=true;render();let more=null;
  try{
    const{data,error}=await db.rpc("lookup_tickets",{p_code:code,p_phone:ph});if(error)throw error;
    if(data&&data.found){
      remember("mm_hist",code,10);
      T.res=data;T.code=code;T.ph=ph;
      if(data.kind==="registration"&&data.status==="paid")more=data;
    }else T.nf=true;
  }catch(_){T.msg="We couldn't reach the server. Please check your internet and try again."}
  T.busy=false;const y=window.scrollY;render();window.scrollTo(0,y);
  /* speed: the booking is already on screen; the "Your transfers" box is added when its own answer arrives */
  if(more)db.rpc("transfer_status",{p_booking_code:code,p_phone:ph}).then(x=>{
    more.xstatus=x.error||!x.data||!x.data.found?null:x.data;
    if(S.step==="tickets"&&T.res===more&&more.xstatus){const y2=window.scrollY;render();window.scrollTo(0,y2)}}).catch(()=>{});
}
function openTickets(pre){S.step="tickets";const T=S.tk;ensureTicketFonts();loadLogo();loadEvent();T.res=null;T.nf=false;T.msg="";T.phone="";T.q=pre||"";render();(S.pay?Promise.resolve():loadPay()).then(loadTI).then(()=>{if(S.step==="tickets")render()})}
async function viewTickets(){const T=S.tk;const d=T.res;if(!d)return;
  const live=d.tickets.filter(t=>!t.transferred&&t.secret);if(!live.length)return;S.cur={booking_code:d.booking_code,tickets:live};S.step="ticket";render();logAct("view",live.map(t=>t.label));
  /* speed: the ticket is drawn at once from what is already on screen. The database is then asked again in the background, so a game message or prize
     switched on since the page was opened still appears: the ticket is drawn again only if something on it changed. */
  if(T.code&&T.ph){try{const r=await Promise.race([db.rpc("lookup_tickets",{p_code:T.code,p_phone:T.ph}),new Promise((_,j)=>setTimeout(j,4000))]);
    if(r&&!r.error&&r.data&&r.data.found&&r.data.kind===d.kind){r.data.xstatus=d.xstatus;T.res=r.data;
      const nl=r.data.tickets.filter(t=>!t.transferred&&t.secret),sig=a=>JSON.stringify(a.map(t=>[t.label,t.secret,t.name,t.food,t.game_message||"",t.game_prize||"",t.game_prize_heading||""]));
      if(nl.length&&S.step==="ticket"&&S.cur&&S.cur.booking_code===d.booking_code&&sig(nl)!==sig(S.cur.tickets)){S.cur={booking_code:d.booking_code,tickets:nl};render()}}}catch(_){}}}

async function xSell(){
  const x=S.xs;if(x.busy)return;x.err="";
  const code=normCode(x.code),ph=String(x.phone||"").replace(/\D/g,"");
  if(!/^[0-9A-F]{8}$/.test(code)||!x.ticket.trim()||!/^\d{10}$/.test(ph)||(x.mode==="public"&&!x.upi.trim())){x.err="Please fill in all the fields. The phone number must be 10 digits.";return render()}

  try{

async function xOpenCode(){
  const b=S.xb;if(b.busy)return;b.err="";const c=String(b.code||"").toUpperCase().replace(/[\s-]/g,"");
  if(!/^[A-Z2-9]{6}$/.test(c)){b.err="Please enter the 6-character code.";return render()}
  b.busy=true;render();
  try{
    const{data,error}=await db.rpc("transfer_open",{p_code:c});if(error)throw error;
    if(data&&data.ok){if(b.sidFor!==c){b.sid=uuid();b.sidFor=c}   /* one submission ID per code: a retry of the same form is safe, a different code is a new request */
      Object.assign(b,{mode:data.mode,seller_name:data.seller_name,food_locked:!!data.food_locked,food:data.food||"",code:c});if(b.food_locked)b.food=data.food;S.step="xform";b.busy=false;return render()}
    b.err=xerr(data);
  }catch(_){b.err="We couldn't reach the server. Please check your internet and try again."}
  b.busy=false;render();
}

async function tPaySubmit(){
  const p=S.xp;if(p.busy)return;p.err="";
  if(!p.file){p.err="Upload your payment screenshot to continue.";return render()}
  p.busy=true;render();
  try{
    const blob=await compress(p.file),ext={"image/jpeg":"jpg","image/png":"png","image/webp":"webp"}[blob.type];
    if(!ext)p.err="Please upload the screenshot as a JPG or PNG image.";
    else{

  const push=v=>{const b=typeof v==="string"?enc.encode(v):v;parts.push(b);len+=b.length};

  imgs.forEach((im,i)=>{const W=im.w/2,H=im.h/2,p=3+3*i;
    obj(p,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im${i} ${p+2} 0 R >> >> /Contents ${p+1} 0 R >>`);
    const cs=`q ${W} 0 0 ${H} 0 0 cm /Im${i} Do Q`;obj(p+1,`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
    offs[p+2]=len;push(`${p+2} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>\nstream\n`);push(im.bytes);push("\nendstream\nendobj\n")});

function compress(file){return new Promise(res=>{

    }
  }catch(e){
    const m=(e&&e.message)||String(e);
    if(/NOT_ENOUGH_SPOTS|REGISTRATION_CLOSED/.test(m)){
      S.busy=false;S.graceLost=/REGISTRATION_CLOSED/.test(m);S.step="loading";await load();
      if(S.step==="form")S.errs=["Some spots were taken while you were registering. Please reduce the number of people, or try again later."];
      render();return}
    else if(/INVALID_/.test(m)){S.step="form";S.errs=["Some details were not accepted ("+(m.match(/INVALID_\w+/)||[""])[0]+"). Please check each field."]}
    else if(/SCREENSHOT_MISSING/.test(m))S.payErr="The screenshot did not upload. Please select it again and submit.";
    else S.payErr="Could not reach the server. Check your internet and tap Submit again. Tapping again will not create a duplicate booking. (Technical detail: "+m.slice(0,140)+")"
  }finally{S.busy=false}
  render();
}

document.addEventListener("input",e=>{const t=e.target;
  if(t.classList&&t.classList.contains("ph"))t.value=cleanPhone(t.value);
  if(t.id==="bq")S.tk.q=t.value;
  if(t.id==="tkph")S.tk.phone=t.value;
  if(t.dataset.xs)S.xs[t.dataset.xs]=t.value;
  if(t.dataset.xb)S.xb[t.dataset.xb]=t.value;
  if(t.dataset.x)S.xb[t.dataset.x]=t.value;
  if(t.dataset.fb==="comment"&&S.fb)S.fb.comment=t.value;
  if(t.dataset.k)S.people[+t.dataset.i][t.dataset.k]=t.value});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.target.id==="bq"||e.target.id==="tkph")){e.preventDefault();doSearch()}if(e.key==="Enter"&&e.target.id==="xb_c"){e.preventDefault();xOpenCode()}});
/* a chip was chosen: take the red mark and message off that question */
function fClear(t){const i=+t.dataset.i,k=t.dataset.k,w=t.closest(".bad");if(S.ferr&&S.ferr[i])delete S.ferr[i][k];if(w){w.classList.remove("bad");const f=w.querySelector(".fe");if(f)f.remove()}}
/* Register form: the thin progress line in the header and the header shadow follow the scroll */
addEventListener("scroll",()=>{if(S.step!=="form")return;const p=document.getElementById("fprog");if(!p)return;
  const h=document.documentElement,m=h.scrollHeight-innerHeight;p.style.transform="scaleX("+(m>0?Math.min(1,scrollY/m):0)+")";
  const hd=document.querySelector(".fpage .hhead");if(hd)hd.classList.toggle("sc",scrollY>8)},{passive:true});
document.addEventListener("change",e=>{const t=e.target;
  if(t.id==="fr"){S.friends=t.checked;setN(t.checked?2:1);S.ferr=null;render()}
  else if(t.dataset&&t.dataset.k==="occ"){const i=+t.dataset.i,p=S.people[i];if(p.occFor!==p.occ){p.occd="";p.occFor=p.occ}
    fClear(t);if(S.ferr&&S.ferr[i])delete S.ferr[i].occd;
    const b=document.getElementById("ob"+i);if(b){b.classList.remove("bad");b.innerHTML=occBox(i,p)}}
  else if(t.dataset&&t.dataset.k&&t.type==="radio"){fClear(t)}
  else if(t.name==="cnt"){setN(+t.value);S.ferr=null;render()}
  else if(t.dataset&&t.dataset.x&&t.type==="radio"){S.xb[t.dataset.x]=t.value}
  else if(t.dataset&&t.dataset.fb==="rating"&&S.fb){S.fb.rating=+t.value}
  else if(t.id==="xf_ok"){S.xb.consent=t.checked}
  else if(t.id==="tshot"){const f=t.files[0],P=S.xp;
    if(f&&(!f.type.startsWith("image/")||f.size>25*1048576)){P.err="Choose an image file (a screenshot or photo).";t.value="";P.file=null;P.fileUrl=null;render()}
    else{try{if(P.fileUrl)URL.revokeObjectURL(P.fileUrl)}catch(_){}P.file=f||null;P.fileUrl=f?URL.createObjectURL(f):null;P.err="";render()}}
  else if(t.id==="shot"){const f=t.files[0];
    if(f&&(!f.type.startsWith("image/")||f.size>25*1048576)){$("#ferr").textContent="Choose an image file (a screenshot or photo).";t.value="";S.file=null;S.fileUrl=null}else{try{if(S.fileUrl)URL.revokeObjectURL(S.fileUrl)}catch(_){}S.file=f||null;S.fileUrl=f?URL.createObjectURL(f):null;S.payErr="";render()}}});
const HOME_GO={"bar-register":"main","hero-register":"main","go-register":"main","hero-tickets":"alt","go-tickets":"alt"};
document.addEventListener("click",async e=>{const el=e.target.closest("button,a"),id=el?el.id:"",ds=el?el.dataset:{};
  /* Home: the main button registers (or, for a returning visitor, opens their ticket); the second one does the opposite. The ids are shared with other screens, so only on Home. */
  if(S.step==="home"&&(id==="hero-register"||id==="hero-tickets"||id==="bar-register")){const jt=document.getElementById("home-join");
    if(jt){jt.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth",block:"center"});return}}
  if(S.step==="home"&&HOME_GO[id]){if((HOME_GO[id]==="main")!==homeRet()){S.step="loading";render();load()}else openTickets("");return}
  if(id==="go-home"){S.step="home";render();loadHomeStatus().then(()=>{if(S.step==="home")refreshHome()})}
  if(id==="go-about"){S.step="about";render()}
  if(ds.about==="r6"){S.step="about";render();setTimeout(()=>{const t=document.getElementById("ab-r6");if(t&&S.step==="about")t.scrollIntoView({behavior:"auto",block:"start"})},120)}   /* the "About R6" item of the three-dot menu: opens About us and jumps to its last card */
  if(e.target.classList&&e.target.classList.contains("tm-sheet"))tmClose();
  if(id==="go-team"){S.step="teams";render()}
  if(ds.tmTeam!==undefined&&ds.tmTeam!==""){S.tm.team=Math.max(0,Math.min(TEAMS.length-1,+ds.tmTeam||0));S.step="team";render()}
  if(id==="tm-back"){S.step="teams";render()}
  if(id==="tm-all"){S.step="members";render()}
  if(id==="tm-prev"||id==="tm-next"){tmStep(id==="tm-next"?1:-1)}
  if(ds.tmMem!==undefined&&ds.tmMem!==""){tmOpen(+ds.tmMem)}
  if(id==="tm-x")tmClose();
  if(ds.contact!==undefined&&ds.contact!=="")contactOpen(ds.contact);   /* "Contact the organisers" with 2 or 3 contacts */
  if(id==="tm-home"){S.step="home";render();try{const t=document.getElementById("home-team");if(t)t.scrollIntoView({block:"center",behavior:"instant"})}catch(_){}loadHomeStatus().then(()=>{if(S.step==="home")refreshHome()})}
  if(id==="go-register"){S.step="loading";render();load()}
  if(id==="go-tickets")openTickets(S.step==="done"&&S.result?S.result.booking_code:S.step==="xdone"&&S.xb.result?S.xb.result.booking_code:"");
  if(id==="back-tickets"){S.step="tickets";render()}
  if(id==="tsearch")doSearch();
  if(id==="trefresh"){S.tk.msg="";await doSearch();toast("Status refreshed")}
  if(ds.hist){S.tk.q=ds.hist;S.tk.res=null;S.tk.nf=false;render();const ph=$("#tkph");if(ph)ph.focus()}
  if(ds.view)viewTickets();
  /* ----- transfers ----- */
  if(id==="go-xmenu"){S.step="xmenu";render();loadTI().then(()=>{if(S.step==="xmenu")render()})}
  if(ds.xstart){const d=S.tk.res;S.xs={mode:"private",code:d?d.booking_code:"",ticket:"",phone:S.tk.ph||"",upi:"",busy:false,err:"",res:null};S.step="xmenu";render()}
  if(ds.xgo){const[m,sd]=ds.xgo.split("-");if(sd==="sell"){const keep=S.xs;S.xs={mode:m,code:keep.code||"",ticket:keep.ticket||"",phone:keep.phone||"",upi:"",busy:false,err:"",res:null};S.step="xsell"}else{S.xb={code:"",busy:false,err:""};S.step="xbuy"}render()}
  if(id==="xsell")xSell();
  if(id==="copycode"){try{await navigator.clipboard.writeText(S.xs.res.code);toast("Code copied")}catch(_){toast("Press and hold the code to copy")}}
  if(id==="go-xbuy"){S.step="xbuy";render()}
  if(id==="xopen")xOpenCode();
  if(id==="xsubmit")xSubmit();
  if(id==="fbsend")fbSend();
  if(id==="copyxid"){try{await navigator.clipboard.writeText(S.xb.result.booking_code);toast("Booking ID copied")}catch(_){toast("Press and hold the ID to copy")}}
  if(ds.xcancel&&S.tk.code){if(!confirm("Cancel this transfer code? Nobody will be able to use it."))return;
    try{const{data,error}=await db.rpc("transfer_cancel",{p_booking_code:S.tk.code,p_ticket:ds.xcancel,p_phone:S.tk.ph});if(error)throw error;
      if(data&&data.ok){toast("Code cancelled");await doSearch()}else toast(xerr(data),4500)}catch(_){toast("We couldn't reach the server. Please try again.",3500)}}
  if(ds.tpay&&S.tk.res&&S.tk.res.transfer){S.xp={code:S.tk.code,ph:S.tk.ph,amount:S.tk.res.transfer.amount_due,sid:uuid(),file:null,fileUrl:null,busy:false,err:""};S.step="tpay";S.payLoading=true;S.payFail=false;render();loadPay().then(ok=>{S.payLoading=false;S.payFail=!ok;if(S.step==="tpay")render()})}
  if(id==="tp-back"&&!S.xp.busy){S.step="tickets";render()}
  if(id==="tp-retry"){S.payLoading=true;S.payFail=false;render();loadPay().then(ok=>{S.payLoading=false;S.payFail=!ok;if(S.step==="tpay")render()})}
  if(id==="tp-submit")tPaySubmit();
  if(ds.dl)downloadTicket(ds.dl,+ds.i);
  if(id==="dl-all-pdf")downloadAll("pdf");
  if(id==="dl-all-jpg")downloadAll("jpg");
  if(id==="retry"||id==="recheck"){S.graceLost=false;S.step="loading";render();load()}
  if(id==="review"){S.errs=[];S.ferr=validate();
    if(fHas(S.ferr)){render();const f1=document.querySelector("#app .bad");if(f1){f1.scrollIntoView({behavior:"smooth",block:"center"});f1.classList.add("shake")}}
    else{S.ferr=null;S.step="summary";render()}}
  if(id==="edit"){S.step="form";S.errs=[];S.ferr=null;render()}
  if(id==="topay")goPay();
  if(id==="payretry")goPay();
  if(id==="back"&&!S.busy){S.step="summary";render()}
  if(id==="copy"){try{await navigator.clipboard.writeText(S.pay.upi);toast("UPI ID copied")}catch(_){toast("Press and hold the UPI ID to copy")}}
  if(id==="copyid"){try{await navigator.clipboard.writeText(S.result.booking_code);toast("Booking ID copied")}catch(_){toast("Press and hold the ID to copy")}}
  if(id==="dl")download();
  if(id==="share"){const f=await qrFile();
    if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:"Pay ₹"+shownAmt()})}catch(_){}}
    else{await download(f);toast("Sharing isn't supported here, so the QR was downloaded")}}
  if(id==="submit")submit();
  if(id==="again"){resetBookingForm();S.result=null;S.step="loading";render();load()}
});
render();loadEvent().then(()=>{if(S.step==="home")refreshHome()});
loadHomeStatus().then(()=>{if(S.step==="home")refreshHome()});
loadPay().then(()=>{if(["closed","done"].includes(S.step))render()});   /* Home shows nothing from the payment details, so it is not redrawn for them */
loadFlags().then(()=>{if(S.step==="home")refreshHome()});
</script></body></html>
