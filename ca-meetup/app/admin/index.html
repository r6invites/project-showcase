<body><div class="app"><nav class="rail" id="rail" aria-label="Main"></nav><main><header class="tbar" id="top"></header><div class="page" id="app"></div></main></div><nav class="bnav" id="bnav" aria-label="Main"></nav><div class="more" id="more" hidden></div><div id="wbar"></div>
<script src="../demo/demo-backend.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
try{const th=localStorage.getItem("adm_theme");if(th==="dark"||th==="light")document.documentElement.dataset.theme=th}catch(_){}
const CFG={url:"demo://sample",key:"demo"};
const SIMILAR_BITS=8;                // images differing by <= this many of 1024 bits count as "possibly the same screenshot" (real tests: identical file = 0 bits; different PhonePe payments = 8 bits; different Google Pay payments = ~27)
const db=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true}});
const $=s=>document.querySelector(s),esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(3,"0"),inr=n=>"₹"+Number(n||0).toLocaleString("en-IN");
const S={staff:null,tab:"overview",bookings:[],tickets:[],scans:[],settings:null,mode:"both",f:{q:"",food:"",loc:"",role:"",pay:"",type:"",review:false,here:""},msg:"",charts:[],scanning:false,alert:null,log:[],payOpen:false,ctOpen:false,
  fb:[],fbOk:false,transfers:[],buyers:[],tReady:false,money:null,ipf:null,showMoved:false,actOk:false,act:{}};
function toast(t,ms){let c=document.getElementById("toasts");if(!c){c=document.createElement("div");c.id="toasts";c.setAttribute("role","status");c.setAttribute("aria-live","polite");document.body.appendChild(c)}
  const d=document.createElement("div");d.className="toast";d.textContent=t;c.appendChild(d);setTimeout(()=>d.remove(),ms||2400)}
Object.assign(S,{dlg:null,dlgSkip:null,rt:null,shk:null,refreshing:false,quiet:false});

/* ---------- progress: a thin bar at the top and a guard against double taps while the database is working ---------- */
let inflight=0;
const track=async p=>{if(S.quiet)return p;inflight++;document.body.classList.add("working");try{return await p}finally{inflight--;if(!inflight)document.body.classList.remove("working")}};
const rawRpc=db.rpc.bind(db);db.rpc=(...a)=>track(rawRpc(...a));

/* ---------- in-app dialogs (replace the browser's own confirm and prompt boxes) ----------
   ask({title,text,ok,cancel,danger,input}) resolves true/false, or with the typed text / null when it has an input.
   Enter confirms, Escape or a tap outside cancels, and the phone's back gesture cancels the dialog instead of leaving the screen behind it. */
function ask(o){
  o=o||{};
  return new Promise(res=>{
    const prev=document.activeElement,bg=document.createElement("div"),box=document.createElement("div"),inp=o.input?document.createElement("input"):null;
    bg.className="dlg-bg";box.className="dlg"+(o.danger?" danger":"");box.setAttribute("role","alertdialog");box.setAttribute("aria-modal","true");box.setAttribute("aria-labelledby","dlgt");
    const h=document.createElement("h2");h.id="dlgt";h.textContent=o.title||(o.input?"Please type":"Please confirm");box.appendChild(h);
    if(o.text){const p=document.createElement("div");p.className="dlg-t";p.textContent=o.text;box.appendChild(p)}
    if(o.node)box.appendChild(o.node);
    if(inp){const i=o.input;inp.type=i.type||"text";inp.value=i.value||"";if(i.placeholder)inp.placeholder=i.placeholder;if(i.min!=null)inp.min=i.min;if(i.max!=null)inp.max=i.max;if(i.maxLength)inp.maxLength=i.maxLength;inp.autocomplete="off";inp.setAttribute("aria-label",o.title||"Answer");box.appendChild(inp)}
    const act=document.createElement("div"),no=document.createElement("button"),yes=document.createElement("button");act.className="dlg-a";
    no.className="ghost";no.dataset.dlg="no";no.textContent=o.cancel||"Cancel";yes.dataset.dlg="yes";yes.textContent=o.ok||"OK";if(o.danger)yes.className="bad";
    act.append(no,yes);box.appendChild(act);bg.appendChild(box);document.body.appendChild(bg);
    let done=false,pushed=false;
    try{history.pushState({...(history.state||{}),dlg:1},"");pushed=true}catch(_){}
    const close=(ok,fromPop)=>{
      if(done)return;done=true;S.dlg=null;document.removeEventListener("keydown",key,true);bg.remove();
      try{prev&&prev.isConnected&&prev.focus&&prev.focus({preventScroll:true})}catch(_){}
      const v=ok?(inp?inp.value:true):(inp?null:false);
      if(pushed&&!fromPop){   /* remove the history step the dialog added, and only then continue, so the next screen change does not clash with it */
        let fired=false;const go=()=>{if(!fired){fired=true;res(v)}};S.dlgSkip=go;
        try{history.back()}catch(_){S.dlgSkip=null;go()}
        setTimeout(()=>{if(S.dlgSkip===go){S.dlgSkip=null;go()}},500)}
      else res(v)};
    const key=e=>{
      if(e.key==="Escape"){e.preventDefault();e.stopPropagation();close(false)}
      else if(e.key==="Enter"&&e.target!==no){e.preventDefault();e.stopPropagation();close(true)}
      else if(e.key==="Tab"){const f=[...box.querySelectorAll("input,button")].filter(x=>!x.disabled),i=f.indexOf(document.activeElement);
        if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus()}}};
    document.addEventListener("keydown",key,true);S.dlg=close;
    bg.addEventListener("click",e=>{e.stopPropagation();const b=e.target.closest&&e.target.closest("[data-dlg]");if(b)close(b.dataset.dlg==="yes");else if(e.target===bg)close(false)});
    (inp||(o.danger?no:yes)).focus();if(inp)inp.select();
  })}
/* yes("Question?\n\nMore words") shows "Question?" as the title when the first line is short, and the rest as the text */
const yes=(text,o)=>{o=o||{};let title=o.title,body=text;
  if(title&&text.split("\n")[0].trim()===title)body=text.split("\n").slice(1).join("\n").trim();   // do not say the same question twice
  if(!title){const i=text.indexOf("\n"),first=(i<0?text:text.slice(0,i)).trim();if(first.length<=80&&/\?$/.test(first)){title=first;body=i<0?"":text.slice(i).trim()}}
  return ask({title,text:body,danger:/cannot be undone/i.test(text),...o})};


/* ---------- boot / auth ---------- */
async function boot(){
  const{data:{session}}=await db.auth.getSession();
  if(!session){S.staff=null;return view()}
  const{data,error}=await db.from("staff").select("name,role").eq("user_id",session.user.id).maybeSingle();
  if(error||!data){S.staff=null;S.msg="This account is not set up as an organiser yet. Ask the admin to add it.";await db.auth.signOut();return view()}
  S.staff=data;
  if(data.role==="admin"){await load();if(location.hash==="#gate")S.tab="gate"}else{S.tab="gate";await gLoad()}
  try{history.replaceState({tab:S.tab,sheets:[],y:0},"")}catch(_){}
  view();
}
/* Data is read in named parts, all at once. After an action only the parts it can have changed are read again, for example sync("core","log").
   sync() with no names reads everything. Parts: core (bookings, tickets, scans, settings), reg, alert, log, emails, fb, tr (transfers), ip, msg, pz. */
const G={
  core:async()=>{try{const[b,t,sc,st]=await Promise.all([db.from("bookings").select("*").order("created_at"),db.from("tickets").select("*").order("reg_seq"),db.from("screenshot_scans").select("*"),db.from("settings").select("*").eq("id",1).single()]);
    const e=b.error||t.error||sc.error||st.error;if(e){S.msg="Could not load data: "+e.message;return false}
    if(/^Could not load data/.test(S.msg||""))S.msg="";
    S.bookings=b.data;S.tickets=t.data;S.scans=sc.data;S.settings=st.data;return true}catch(e){S.msg="Could not load data: "+((e&&e.message)||"network problem");return false}},
  reg:async()=>{try{const r=await db.rpc("admin_registration_status");S.reg=r.error?null:r.data;const rp=$("#regpill");if(rp)rp.outerHTML=regPill()}catch(_){S.reg=null}},
  alert:async()=>{try{const r=await db.rpc("admin_payment_alert");S.alert=r.error?null:r.data}catch(_){S.alert=null}},
  log:async()=>{try{const r=await db.from("settings_log").select("*").order("id",{ascending:false}).limit(200);S.log=r.error?[]:r.data}catch(_){S.log=[]}},
  /* transfers and IP flags exist only after the Release 2 database update */
  fb:async()=>{try{const r=await db.from("booking_feedback").select("booking_id,rating,comment,created_at,updated_at").order("updated_at",{ascending:false});S.fbOk=!r.error;S.fb=r.error?[]:r.data}catch(_){S.fbOk=false;S.fb=[]}},
  tr:async()=>{try{const[x,y]=await Promise.all([db.from("transfers").select("*").order("created_at",{ascending:false}),db.from("transfer_buyers").select("*")]);
    S.tReady=!x.error&&!y.error;S.transfers=x.error?[]:x.data;S.buyers=y.error?[]:y.data;S.money=null;
    if(S.tReady){const m=await db.rpc("admin_transfer_money");S.money=m.error?null:m.data}}catch(_){S.tReady=false;S.transfers=[];S.buyers=[]}},
  ip:async()=>{try{const r=await db.rpc("admin_ip_flags");S.ipf=r.error?null:r.data}catch(_){S.ipf=null}},
  /* messages exist only after sql/r2_13 has been run; before that the Messages tab and card stay hidden */
  msg:async()=>{try{const[x,y]=await Promise.all([db.from("game_messages").select("*").order("created_at"),db.from("ticket_messages").select("ticket_id,message_id")]);
    S.msgOk=!x.error&&!y.error;S.msgs=x.error?[]:x.data;S.tm=y.error?{}:Object.fromEntries(y.data.map(r=>[r.ticket_id,r.message_id]))}catch(_){S.msgOk=false;S.msgs=[];S.tm={}}},
  /* "pick random people" (r2_14) exists only after sql/r2_14 has been run; before that its card stays hidden */
  pz:async()=>{try{const r=await db.from("ticket_prizes").select("ticket_id,body,heading");S.pzOk=!r.error;S.pz=r.error?{}:Object.fromEntries(r.data.map(x=>[x.ticket_id,x.body]));S.pzh=r.error?{}:Object.fromEntries(r.data.map(x=>[x.ticket_id,x.heading]))}catch(_){S.pzOk=false;S.pz={};S.pzh={}}},
  /* ticket page views and Download presses (r2_19) exist only after sql/r2_19 has been run (admins only); before that the tags, chip and card stay hidden */
  act:async()=>{try{const r=await db.rpc("admin_ticket_activity");S.actOk=!r.error&&Array.isArray(r.data);S.act=S.actOk?Object.fromEntries(r.data.map(x=>[x.ticket_id,x])):{}}catch(_){S.actOk=false;S.act={}}}
};
async function sync(...names){
  const list=names.length?names:Object.keys(G),r=await track(Promise.all(list.map(n=>G[n]())));
  return r.every(x=>x!==false)}
const load=()=>sync();
/* ===== live registration status banner (daily pause + 10-minute grace) ===== */
function fmtIST(iso){try{const d=new Date(iso),day=x=>x.toLocaleDateString("en-IN",{day:"numeric",month:"short",timeZone:"Asia/Kolkata"});
  return d.toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit",hour12:true,timeZone:"Asia/Kolkata"}).toUpperCase()+(day(d)===day(new Date())?"":" on "+day(d))}catch(_){return""}}
function regBar(){const r=S.reg;if(!r)return `<div id="regbar"></div>`;
  const box=(c,t)=>`<div id="regbar" class="card" style="border-color:${c};margin-bottom:10px">${t}</div>`;

function extractIds(t){const ids=new Set();

function extractAmounts(t){
  const out=new Set();
  (t.match(/[^\s\d]?\d[\d,]*(?:\.\d{1,2})?/g)||[]).forEach(tok=>{
    const d=tok.replace(/^[^\d]+/,""),n=d.replace(/[^\d.]/g,"");          // drop a leading symbol such as % ~ z
    if(d.replace(/\D/g,"").length>7)return;                                // skip IDs and other long numbers
    const v=parseFloat(n);if(isFinite(v)&&v>0)out.add(v);
    if(/^[23]\d/.test(d)){const w=parseFloat(d.slice(1).replace(/[^\d.]/g,""));if(isFinite(w)&&w>0)out.add(w)}  // rupee sign read as the digit 2 or 3
  });

}

  let t2="";try{await w.setParameters({tessedit_pageseg_mode:"11"});t2=(await w.recognize(await shrink(blob,.5))).data.text}catch(_){}

async function tAction(act,id){
  const x=S.transfers.find(y=>y.id===id);if(!x)return;const b=buyerOf(x);
  if(act==="ask")return tcall("admin_transfer_request_payment",{p_transfer:id},"The buyer can now see the payment screen");
  if(act==="shot")return shots([{path:x.payment_screenshot_path,label:"Buyer payment"+(b?" · "+b.name:"")}]);
  if(act==="verify"){const v=+($("#amt-"+id)||{}).value;if(!(v>=1))return toast("Type the amount that actually arrived in the bank",4000);
    if(!Number.isInteger(v))return toast("Type whole rupees only (no paise or decimals)",4000);
    const diff=x.amount_due!=null&&v!==x.amount_due;
    if(!await yes((diff?"CHECK THE AMOUNT: you asked the buyer for ₹"+x.amount_due+" but you typed ₹"+v+".\n"+(v<x.amount_due?"That is LESS than asked, so the seller will be owed less.":"That is MORE than asked.")+"\nPress OK only if ₹"+v+" really arrived.\n\n":"")+"Confirm: ₹"+v+" has arrived in the bank account for this transfer?\n\nThe seller will be owed exactly ₹"+v+".",{title:diff?"Check the amount":"Payment received?",ok:"Yes, it arrived",danger:diff}))return;
    return tcall("admin_transfer_verify_payment",{p_transfer:id,p_amount:v},"Payment verified")}
  if(act==="approve"){
    if(!await yes("Transfer ticket "+sellerLbl(x)+" ("+x.seller_name+") to "+(b?b.name:"the buyer")+"?\n\n"+x.seller_name+"'s ticket is cancelled for good and "+(b?b.name:"the buyer")+" receives a new ticket number. This cannot be undone.",{ok:"Transfer"}))return;
    const r=await tcall("admin_transfer_approve",{p_transfer:id},"Done.");if(r&&r.new_label)toast("Transferred: "+r.old_label+" → "+r.new_label,5000);return}
  if(act==="reject"){
    const warn=x.kind==="public"&&x.payment_submitted_at?"\n\nThe buyer has already paid: the money will be marked as TO RETURN.":"";
    const note=await ask({title:x.status==="code_active"?"Cancel this code?":"Reject this transfer?",text:(warn?warn.trim()+"\n\n":"")+"Optional note (why):",input:{value:"",placeholder:"Why? (optional)",maxLength:300},ok:x.status==="code_active"?"Cancel code":"Reject",danger:true});if(note===null)return;
    return tcall("admin_transfer_reject",{p_transfer:id,p_note:note.trim()||null},x.status==="code_active"?"Code cancelled":"Transfer rejected")}
  if(act==="extend"){const h=await ask({title:"Extend this code",text:"Keep this code valid for how many more hours from now? (1 to 168)",input:{value:"24",type:"number",min:1,max:168},ok:"Extend"});if(h===null)return;
    return tcall("admin_transfer_extend_code",{p_transfer:id,p_hours:parseInt(h,10)},"Code extended")}
  if(act==="paid"||act==="returned"){const ref=await ask({title:act==="paid"?"Mark the seller as paid":"Mark the money as returned",text:act==="paid"?"The seller was paid ₹"+x.amount_received+". Type the payment reference (for example the UPI transaction ID):":"The buyer's money was sent back. Type the payment reference (or a short note such as “no money received”):",input:{value:"",placeholder:"Reference",maxLength:80},ok:act==="paid"?"Mark paid":"Mark returned"});if(ref===null)return;
    return tcall(act==="paid"?"admin_transfer_mark_paid":"admin_transfer_mark_returned",{p_transfer:id,p_reference:ref.trim()},act==="paid"?"Seller marked as paid":"Return recorded")}
}

      p_pause_enabled:$("#spause").checked,p_pause_close:$("#sclose").value||null,p_pause_open:$("#sreopen").value||null});
    if(r.error)return toast("Failed: "+r.error.message);await sync("core","reg","log");view({keepForm:true});toast("Settings saved")}
}
document.addEventListener("click",async e=>{
  const b=e.target.closest&&e.target.closest("button"),quick=!b||b.matches(".lk,.chip,.tg,[data-tab],.nav,#theme,#morebtn,[data-sheet],[data-sback],[data-jump],[data-gotab],[data-medit],[data-muse],[data-act],[data-pick],[data-dlg],[data-dk],[data-pview],[data-pchip],[data-gl],[data-tjump],#camtoggle");
  if(!quick&&b.dataset.run)return;   // this button is still working on the last tap
  if(!quick)b.dataset.run="1";
  try{await onClick(e)}catch(err){toast("Something went wrong: "+String((err&&err.message)||err).slice(0,120),6000)}
  finally{if(!quick)delete b.dataset.run}
});
document.addEventListener("change",e=>{const t=e.target;
  if(S.staff&&S.staff.role==="admin"&&S.msgOk&&msgChange(t))return;
  if(t.id==="sopen"&&$("#pausebox"))$("#pausebox").style.display=t.checked?"block":"none";
  if(t.id==="mode"){S.mode=t.value;view()}

  if(t.dataset.sel){t.checked?selSet().add(t.dataset.sel):selSet().delete(t.dataset.sel);const sb=$("#selbar");if(sb)sb.outerHTML=selBarH()}
  if(t.dataset.tcall){tcall("admin_transfer_confirm_call",{p_transfer:t.dataset.tcall,p_confirmed:t.checked},t.checked?"Call confirmed":"Call tick removed")}
  if(["fpay","ffood","floc","frole","ftype","fhere","frev"].includes(t.id)){S.f.pay=$("#fpay")?.value??S.f.pay;if($("#ffood")){S.f.food=$("#ffood").value;S.f.loc=$("#floc").value;S.f.role=$("#frole").value;S.f.type=$("#ftype").value;S.f.here=$("#fhere").value}if($("#frev"))S.f.review=$("#frev").checked;S.tab==="people"?tPeople():tBookings()}});
document.addEventListener("input",e=>{if(e.target.id==="lbody"){S.mf.lot.body=e.target.value;return}if(e.target.id==="lhead"){S.mf.lot.head=e.target.value;return}if(e.target.id==="ln"){S.mf.lot.n=e.target.value;return}if(e.target.id==="mname"){S.mf.name=e.target.value;return}if(e.target.id==="mbody"){S.mf.body=e.target.value;return}if(e.target.id==="gfq"){S.gfind=e.target.value;gResults();return}if(e.target.id==="gtop"){S.gq=e.target.value;gSearch();return}if(e.target.id==="q"){S.f.q=e.target.value;S.tab==="people"?tPeople():tBookings()}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.target.id==="pw"||e.target.id==="em"))$("#login").click()});
/* Keeps the data fresh without anyone pressing Refresh: every minute while the page is in front, and when you come back to it after a while.
   It only redraws when something really changed, and never while you are typing or a dialog is open. */
const dataSig=()=>JSON.stringify([S.bookings,S.tickets,S.scans,S.settings,S.transfers,S.buyers,S.fb,S.msgs,S.tm,S.pz,S.pzh,S.log,S.alert,S.ipf,S.money]);
let hiddenAt=0;
async function autoRefresh(){
  if(!S.staff||S.staff.role!=="admin"||S.tab==="gate"||S.scanning||S.busy||S.refreshing||S.dlg||S.desk||document.visibilityState!=="visible")return;
  S.refreshing=true;S.quiet=true;
  try{const m0=S.msg,before=dataSig(),ok=await sync();
    if(!ok){S.msg=m0;return}
    if(dataSig()===before)return;
    const el=document.activeElement,typing=el&&el.matches&&el.matches("#app input:not([type=checkbox]):not([type=radio]),#app textarea,#app select,#gtop");
    if(typing||document.querySelector(".dlg-bg,.modal"))return;
    view({keepForm:true})}
  catch(_){}
  finally{S.quiet=false;S.refreshing=false}
}
setInterval(autoRefresh,60000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){hiddenAt=Date.now();return}if(hiddenAt&&Date.now()-hiddenAt>=45000){hiddenAt=0;autoRefresh()}});
boot();
</script></body></html>
