<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c0a0d">
<title>Page not found · R6 Invites</title>
<style>
html{background:#0c0a0d;color-scheme:dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;color:#f5ede2;font:400 16px/1.6 system-ui,-apple-system,'Segoe UI',sans-serif;background:radial-gradient(700px 420px at 80% 0%,rgba(122,31,61,.4),transparent 70%),radial-gradient(600px 400px at 10% 100%,rgba(217,180,111,.13),transparent 70%),#0c0a0d}
.m{width:56px;height:56px;border-radius:16px;margin:0 auto 22px;display:grid;place-items:center;font:700 1.5rem Georgia,serif;color:#1b1209;background:linear-gradient(135deg,#f0d79e,#d9b46f,#b98f4c)}
h1{font:600 clamp(2.4rem,8vw,4rem)/1.05 Georgia,'Times New Roman',serif;margin:0 0 12px}
h1 em{color:#d9b46f}
p{margin:0 auto 28px;max-width:40ch;color:#ab9fa0}
a{display:inline-block;text-decoration:none;font-weight:600;padding:13px 28px;border-radius:999px;color:#1b1209;background:linear-gradient(135deg,#f0d79e,#d9b46f,#b98f4c)}
a:focus-visible{outline:2px solid #f0d79e;outline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="m">R6</div>
  <h1>This page <em>wandered off.</em></h1>
  <p>The link may be old or mistyped. Our projects are all on the home page.</p>
  <a id="home" href="/">See our projects</a>
</main>
<script>
// works on r6invites.github.io/project-showcase/ as well as on a custom domain
var seg=location.pathname.split("/")[1];
if(location.hostname.endsWith(".github.io")&&seg&&!seg.includes(".")) document.getElementById("home").href="/"+seg+"/";
</script>
</body>
</html>
